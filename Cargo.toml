[package]
name = "rxminer"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "RandomX CPU miner with NUMA placement and TLS Stratum"
build = "build.rs"
readme = "README.md"
keywords = ["randomx", "monero", "mining", "stratum", "numa"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.toml", "/Cargo.lock", "/build.rs", "/src/*.rs",
    "/README.md", "/LICENSE", "/config.example.json", "/docs/*.md",
    "/CMakeLists.txt", "/cmake/*.cmake", "/bench/*.cpp",
    "/tests/*.rs", "/tests/support/**", "/tests/randomx/**",
    "/src/crypto/randomx/**",
]

[[bin]]
name = "rxminer"
path = "src/main.rs"

[features]
default = []
# Local regression builds only; never enable for release artifacts.
test-dev-fee = []
vaes = []

[dependencies]
rx-platform = { version = "0.1.0", path = "crates/rx-platform" }
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
libc = "0.2"
getrandom = { version = "0.3", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
subtle = "2.6"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
cc = "1.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
