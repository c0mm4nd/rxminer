name: Package native release
description: Package, extract and smoke-test the actual release archive
inputs:
  platform:
    description: Archive platform suffix
    required: true
  exe:
    description: Executable suffix
    default: ''
runs:
  using: composite
  steps:
    - name: Stage release files and validate tag
      shell: bash
      env:
        RELEASE_PLATFORM: ${{ inputs.platform }}
        EXE_SUFFIX: ${{ inputs.exe }}
        RELEASE_REF: ${{ github.ref }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "rxminer") | .version')
        test -n "$version"
        if [[ "$RELEASE_REF" == refs/tags/* ]]; then
          test "$RELEASE_TAG" = "v$version"
        fi
        name="rxminer-v${version}-${RELEASE_PLATFORM}"
        mkdir -p "dist/$name"
        cp "target/release/rxminer${EXE_SUFFIX}" README.md LICENSE Cargo.lock config.example.json "dist/$name/"
        cp crates/randomx-rust/src/randomx_core/LICENSE "dist/$name/LICENSE-RandomX"
        cp .github/release/LICENSE-ring .github/release/LICENSE-rustls .github/release/LICENSE-webpki "dist/$name/"
        cp -r docs "dist/$name/"
        echo "PACKAGE_NAME=$name" >> "$GITHUB_ENV"
        echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
    - name: Check macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        otool -L "dist/$PACKAGE_NAME/rxminer" | tee "$RUNNER_TEMP/release-dependencies.txt"
        if grep -E 'lib(ssl|crypto|c\+\+)|/opt/homebrew/|/usr/local/' "$RUNNER_TEMP/release-dependencies.txt"; then
          echo 'Unexpected non-system runtime dependency' >&2
          exit 1
        fi
        codesign --force --sign - "dist/$PACKAGE_NAME/rxminer"
        codesign --verify --strict "dist/$PACKAGE_NAME/rxminer"
    - name: Bundle Windows Visual C++ runtime
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $destination = Join-Path 'dist' $env:PACKAGE_NAME
        $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
        $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (!$vs) { throw 'Visual Studio installation not found' }
        $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (!$crt) { throw 'Visual C++ redistributable runtime not found' }
        Copy-Item "$($crt.FullName)/*.dll" $destination
        foreach ($name in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
          if (!(Test-Path "$destination/$name")) { throw "Missing runtime: $name" }
        }
    - name: Archive and verify Unix package
      if: runner.os != 'Windows'
      shell: bash
      run: |
        tar -C dist -czf "dist/$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
        (
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.tar.gz.sha256"
            sha256sum -c "$PACKAGE_NAME.tar.gz.sha256"
          else
            shasum -a 256 "$PACKAGE_NAME.tar.gz" > "$PACKAGE_NAME.tar.gz.sha256"
            shasum -a 256 -c "$PACKAGE_NAME.tar.gz.sha256"
          fi
        )
        check="$RUNNER_TEMP/release-unpacked"
        mkdir -p "$check"
        tar -xzf "dist/$PACKAGE_NAME.tar.gz" -C "$check"
        binary="$check/$PACKAGE_NAME/rxminer"
        test "$("$binary" --version)" = "rxminer $PACKAGE_VERSION"
        if [[ "$RUNNER_OS" == Linux ]]; then
          ldd "$binary" | tee "$RUNNER_TEMP/release-dependencies.txt"
          if grep -E 'lib(ssl|crypto|stdc\+\+)\.' "$RUNNER_TEMP/release-dependencies.txt"; then
            echo 'Unexpected OpenSSL/C++ runtime dependency' >&2
            exit 1
          fi
        fi
        "$binary" --benchmark-seconds 1 --randomx-mode light --threads 1 --no-huge-pages \
          > "$RUNNER_TEMP/release-smoke.log" 2>&1
        cat "$RUNNER_TEMP/release-smoke.log"
        grep -E 'benchmark finished: [1-9][0-9]* hashes' "$RUNNER_TEMP/release-smoke.log"
    - name: Archive and verify Windows package without development PATH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $archive = "dist/$env:PACKAGE_NAME.zip"
        Compress-Archive -Path "dist/$env:PACKAGE_NAME" -DestinationPath $archive
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  $env:PACKAGE_NAME.zip`n" | Set-Content "$archive.sha256" -Encoding ascii -NoNewline
        $check = Join-Path $env:RUNNER_TEMP 'release-unpacked'
        Expand-Archive $archive $check
        $binary = Join-Path $check "$env:PACKAGE_NAME/rxminer.exe"
        $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
        $version = & $binary --version
        if ($LASTEXITCODE -ne 0 -or $version -ne "rxminer $env:PACKAGE_VERSION") { throw 'Packaged version check failed' }
        & $binary --benchmark-seconds 1 --randomx-mode light --threads 1 --no-huge-pages *> "$env:RUNNER_TEMP/release-smoke.log"
        if ($LASTEXITCODE -ne 0) { throw 'Packaged mining smoke failed' }
        Get-Content "$env:RUNNER_TEMP/release-smoke.log"
        if (!(Select-String -Path "$env:RUNNER_TEMP/release-smoke.log" -Pattern 'benchmark finished: [1-9][0-9]* hashes')) {
          throw 'Packaged miner produced no hashes'
        }
    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ inputs.platform }}
        path: |
          dist/*.tar.gz
          dist/*.zip
          dist/*.sha256
        if-no-files-found: error
