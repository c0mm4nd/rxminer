name: release

on:
  workflow_dispatch:
    inputs:
      riscv:
        description: Include the queued RISC-V validation and package (tags always include it)
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            exe: ''
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            exe: ''
          - platform: macos-x86_64
            os: macos-15-intel
            exe: ''
          - platform: macos-aarch64
            os: macos-15
            exe: ''
          - platform: windows-x86_64
            os: windows-2022
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RXMINER_ARCH: default
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Rust checks and production build
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
          cargo test --release --locked
      - name: JIT and native hash vectors
        run: |
          cargo test --locked --release --lib jit_and_secure_jit_match_interpreter -- --ignored --nocapture
          cargo test --locked --release --test native_vectors -- --ignored --nocapture
      - name: Light and full-memory CLI smoke
        timeout-minutes: 10
        run: cargo test --locked --release --test portable -- --ignored --nocapture
      - name: Local protocol and failover regression
        if: matrix.platform == 'linux-x86_64'
        run: cargo test --locked --release --features test-dev-fee --test network --target-dir target/test-dev -- --ignored --test-threads=1 --nocapture
      - uses: ./.github/actions/package
        with:
          platform: ${{ matrix.platform }}
          exe: ${{ matrix.exe }}

  # Enqueue only after all ordinary packages pass; do not spend RISE capacity
  # on every iteration of packaging changes. The reusable job runs one full batch.
  riscv:
    needs: native
    if: startsWith(github.ref, 'refs/tags/') || inputs.riscv
    uses: ./.github/workflows/riscv.yml
    with:
      package: true

  draft:
    needs: [native, riscv]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all six packages and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          for platform in linux-x86_64 linux-aarch64 linux-riscv64 macos-x86_64 macos-aarch64 windows-x86_64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then extension=zip; fi
            name="rxminer-${RELEASE_TAG}-${platform}.${extension}"
            test -s "$name"
            sha256sum -c "$name.sha256"
          done
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Upload complete release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
