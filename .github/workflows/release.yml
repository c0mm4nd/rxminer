name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "rxminer") | .version')
          test -n "$version"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_TAG" = "v$version"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Rust checks and portable release build
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features test-dev-fee -- -D warnings
          cargo test --locked
          cargo build --release --locked
          cargo test --locked --release --lib -- --ignored --test-threads=1

      - name: RandomX tests
        run: |
          cargo test --locked --release --test native_vectors -- --ignored --nocapture
          cargo test --locked --release --test tooling native_regressions -- --ignored --nocapture

      - name: Local protocol regression tests
        run: |
          cargo test --locked --release --features test-dev-fee --test network --target-dir target/test-dev -- --ignored --test-threads=1 --nocapture

      - name: Smoke test
        run: |
          test "$(./target/release/rxminer --version)" = "rxminer $PACKAGE_VERSION"
          ldd ./target/release/rxminer

      - name: Cargo installation without Python, CMake, Make or Ninja
        run: cargo test --locked --release --test tooling cargo_install_without_external_build_tools -- --ignored --nocapture

      - name: Package
        run: |
          name="rxminer-v${PACKAGE_VERSION}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/rxminer README.md LICENSE Cargo.lock config.example.json "dist/$name/"
          cp src/crypto/randomx/LICENSE "dist/$name/LICENSE-RandomX"
          cp -r docs "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: rxminer-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Upload release draft
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
