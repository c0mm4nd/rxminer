name: Rust and native regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: '1.88.0'
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            rust: stable
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config clang
      - name: Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt --component clippy
          rustup default '${{ matrix.rust }}'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features test-dev-fee -- -D warnings
      - run: cargo test --locked
      - name: Full dataset and JIT consensus
        run: cargo test --locked --release --lib -- --ignored --test-threads=1
      - name: Native correctness
        run: cargo test --locked --release --test tooling native_regressions -- --ignored --nocapture
      - name: Local protocol and runtime regression
        run: |
          cargo test --locked --release --features test-dev-fee --test network -- --ignored --test-threads=1 --nocapture
      - name: Package and install without Python, CMake, Make or Ninja
        if: matrix.rust == 'stable'
        run: cargo test --locked --release --test tooling cargo_install_without_external_build_tools -- --ignored --nocapture
  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            exe: ''
          - name: macOS Intel
            os: macos-15-intel
            exe: ''
          - name: macOS Apple Silicon
            os: macos-15
            exe: ''
          - name: Windows x64 MSVC
            os: windows-2022
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkg-config
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:ProgramFiles 'OpenSSL'
          $lib = Join-Path $root 'lib/VC/x64/MD'
          foreach ($file in @("$root/include/openssl/ssl.h", "$lib/libssl.lib", "$lib/libcrypto.lib")) {
            if (!(Test-Path $file)) { throw "Missing preinstalled OpenSSL file: $file" }
          }
          "OPENSSL_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_LIB_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_STATIC=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Rust checks and hash vectors
        run: |
          cargo clippy --locked --all-targets --features test-dev-fee -- -D warnings
          cargo test --locked
      - name: JIT and secure JIT consensus
        run: cargo test --locked --release --lib jit_and_secure_jit_match_interpreter -- --ignored --nocapture
      - name: Full-memory shares and concurrent job switches
        run: cargo test --locked --release --lib full_dataset_shares_match_light_vm_across_fee_switches -- --ignored --nocapture
      - name: Light and full-memory mining
        run: cargo test --locked --release --test portable -- --ignored --nocapture
      - name: Cargo installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/rxminer-install"
          "$RUNNER_TEMP/rxminer-install/bin/rxminer${{ matrix.exe }}" --version
          "$RUNNER_TEMP/rxminer-install/bin/rxminer${{ matrix.exe }}" --benchmark-seconds 1 --randomx-mode light --threads 1 --no-huge-pages
