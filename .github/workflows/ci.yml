name: RandomX backends and runtime regression
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: '1.88.0'
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            rust: stable
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt --component clippy
          rustup default '${{ matrix.rust }}'
      - run: cargo fmt --all --check
      - name: Standalone Rust RandomX core
        run: |
          rustc --edition=2021 -O --test crates/randomx-rust/src/randomx_core/mod.rs -o "$RUNNER_TEMP/randomx-core-tests"
          "$RUNNER_TEMP/randomx-core-tests"
      - run: cargo clippy -p rxminer -p randomx-rust -p rx-platform --locked --all-targets --features test-dev-fee -- -D warnings
      - run: cargo test --locked --release
      - name: Rust backend and platform unit tests
        run: cargo test -p randomx-rust -p rx-platform --locked --release
      - name: Full dataset and Rust consensus
        run: |
          cargo test -p randomx-rust --locked --release --lib -- --ignored --test-threads=1
          cargo test -p rxminer --locked --release --lib -- --ignored --test-threads=1
      - name: Rust backend complete mode contract
        run: cargo test -p rxminer --locked --release --test backend_contract -- --ignored --test-threads=1
      - name: C++ backend lint and runtime tests
        run: |
          cargo clippy -p rxminer -p randomx-cpp -p rx-platform --locked --all-targets --no-default-features --features rxminer/randomx-cpp -- -D warnings
          cargo test -p rxminer --locked --release --no-default-features --features randomx-cpp -- --test-threads=1
          cargo test -p randomx-cpp --locked --release
      - name: C++ backend complete mode contract
        run: cargo test -p rxminer --locked --release --no-default-features --features randomx-cpp --test backend_contract -- --ignored --test-threads=1
      - name: Build separate native reference
        run: |
          cmake -S . -B target/native-reference -DBUILD_SHARED_LIBS=ON
          cmake --build target/native-reference --target randomx-oracles -j 2
      - name: Rust and native reference comparison
        run: |
          RXMINER_NATIVE_LIBRARY="$PWD/target/native-reference/librandomx.so" cargo test --locked --release --test randomx_rust -- --ignored --nocapture
          RXMINER_ORACLE_DIR="$PWD/target/native-reference" cargo test --locked --release --test native_vectors -- --ignored --nocapture
      - name: Protocol and foreground recovery with both backends
        run: |
          cargo test --locked --release --features test-dev-fee --test network --target-dir target/test-dev -- --ignored --test-threads=1 --nocapture
          cargo test --locked --release --no-default-features --features randomx-cpp,test-dev-fee --test network --target-dir target/test-dev -- --ignored --test-threads=1 --nocapture
      - name: Package and install without OpenSSL or external build tools
        if: matrix.rust == 'stable'
        run: cargo test --locked --release --test tooling cargo_install_without_external_build_tools -- --ignored --nocapture
  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            exe: ''
          - name: macOS Intel
            os: macos-15-intel
            exe: ''
          - name: macOS Apple Silicon
            os: macos-15
            exe: ''
          - name: Windows x64 MSVC
            os: windows-2022
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust lint checks
        run: cargo clippy -p rxminer -p randomx-rust -p rx-platform --locked --all-targets --features test-dev-fee -- -D warnings
      - name: Standalone Rust RandomX core
        run: |
          rustc --edition=2021 -O --test crates/randomx-rust/src/randomx_core/mod.rs -o "$RUNNER_TEMP/randomx-core-tests${{ matrix.exe }}"
          "$RUNNER_TEMP/randomx-core-tests${{ matrix.exe }}"
      - name: Unit tests and hash vectors
        timeout-minutes: 15
        run: cargo test --locked --release -- --nocapture
      - name: Rust complete upstream hash vectors
        run: cargo test -p randomx-rust --locked --release --lib upstream_full_hashes -- --ignored --nocapture
      - name: Rust backend and platform unit tests
        run: cargo test -p randomx-rust -p rx-platform --locked --release
      - name: Full-memory shares and concurrent job switches
        run: |
          cargo test --locked --release --lib full_dataset_shares_match_light_vm_across_fee_switches -- --ignored --nocapture
          cargo test --locked --release --lib worker_failures_stop_all_workers_and_clear_state -- --ignored --nocapture
      - name: Light and full-memory mining
        run: cargo test --locked --release --test portable -- --ignored --nocapture
      - name: Rust backend complete mode contract
        run: cargo test -p rxminer --locked --release --test backend_contract -- --ignored --test-threads=1
      - name: C++ backend lint and runtime tests
        run: |
          cargo clippy -p rxminer -p randomx-cpp -p rx-platform --locked --all-targets --no-default-features --features rxminer/randomx-cpp -- -D warnings
          cargo test -p rxminer --locked --release --no-default-features --features randomx-cpp -- --test-threads=1
          cargo test -p randomx-cpp --locked --release
      - name: C++ backend complete mode contract
        run: cargo test -p rxminer --locked --release --no-default-features --features randomx-cpp --test backend_contract -- --ignored --test-threads=1
      - name: Cargo installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/rxminer-install"
          "$RUNNER_TEMP/rxminer-install/bin/rxminer${{ matrix.exe }}" --version
          "$RUNNER_TEMP/rxminer-install/bin/rxminer${{ matrix.exe }}" --benchmark-seconds 1 --randomx-mode light --threads 1 --no-huge-pages
