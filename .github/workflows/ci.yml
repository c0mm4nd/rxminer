name: Rust and native regression
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust: '1.88.0'
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            rust: stable
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt --component clippy
          rustup default '${{ matrix.rust }}'
      - run: cargo fmt --check
      - name: Standalone Rust RandomX core
        run: |
          rustc --edition=2021 --test src/randomx_core/mod.rs -o "$RUNNER_TEMP/randomx-core-tests"
          "$RUNNER_TEMP/randomx-core-tests"
      - run: cargo clippy --locked --all-targets --features test-dev-fee -- -D warnings
      - run: cargo test --locked
      - name: Full dataset and JIT consensus
        run: cargo test --locked --release --lib -- --ignored --test-threads=1
      - name: Native correctness
        run: cargo test --locked --release --test tooling native_regressions -- --ignored --nocapture
      - name: Native vectors and short preparation sample
        env:
          RXMINER_SHORT_BENCH: '1'
        run: cargo test --locked --release --test native_vectors -- --ignored --nocapture
      - name: Optional VAES build and native vectors
        if: matrix.rust == 'stable'
        run: cargo test --locked --release --features vaes --test native_vectors -- --ignored --nocapture
      - name: Local protocol and runtime regression
        run: |
          cargo test --locked --release --features test-dev-fee --test network -- --ignored --test-threads=1 --nocapture
      - name: Package and install without OpenSSL or external build tools
        if: matrix.rust == 'stable'
        run: cargo test --locked --release --test tooling cargo_install_without_external_build_tools -- --ignored --nocapture
  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            exe: ''
          - name: macOS Intel
            os: macos-15-intel
            exe: ''
          - name: macOS Apple Silicon
            os: macos-15
            exe: ''
          - name: Windows x64 MSVC
            os: windows-2022
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust lint checks
        run: cargo clippy --locked --all-targets --features test-dev-fee -- -D warnings
      - name: Standalone Rust RandomX core
        run: |
          rustc --edition=2021 --test src/randomx_core/mod.rs -o "$RUNNER_TEMP/randomx-core-tests${{ matrix.exe }}"
          "$RUNNER_TEMP/randomx-core-tests${{ matrix.exe }}"
      - name: Unit tests and hash vectors
        timeout-minutes: 5
        run: cargo test --locked -- --nocapture
      - name: JIT and secure JIT consensus
        run: cargo test --locked --release --lib jit_and_secure_jit_match_interpreter -- --ignored --nocapture
      - name: Native vectors and short preparation sample
        env:
          RXMINER_SHORT_BENCH: '1'
        run: cargo test --locked --release --test native_vectors -- --ignored --nocapture
      - name: Full-memory shares and concurrent job switches
        run: |
          cargo test --locked --release --lib full_dataset_shares_match_light_vm_across_fee_switches -- --ignored --nocapture
          cargo test --locked --release --lib worker_failures_stop_all_workers_and_clear_state -- --ignored --nocapture
      - name: Light and full-memory mining
        run: cargo test --locked --release --test portable -- --ignored --nocapture
      - name: Cargo installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/rxminer-install"
          "$RUNNER_TEMP/rxminer-install/bin/rxminer${{ matrix.exe }}" --version
          "$RUNNER_TEMP/rxminer-install/bin/rxminer${{ matrix.exe }}" --benchmark-seconds 1 --randomx-mode light --threads 1 --no-huge-pages
