name: RISC-V native regression

# Queue once per completed batch of changes. RISE capacity is shared and scarce.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: Build and validate a release archive after the full batch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: riscv-native
  cancel-in-progress: false

jobs:
  riscv64:
    name: Linux RISC-V64 complete validation
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Native dependencies
        run: |
          test "$(uname -m)" = riscv64
          mkdir -p "$RUNNER_TEMP/riscv-logs"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential jq
      - name: Native Rust toolchain
        id: toolchain
        run: |
          for attempt in 1 2 3; do
            if rustup toolchain install stable --profile minimal --component rustfmt --component clippy; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          rustup override set stable
          rustc -vV > "$RUNNER_TEMP/riscv-logs/toolchain.txt"
          cat "$RUNNER_TEMP/riscv-logs/toolchain.txt"
          # Read a completed file: grep -q in a rustc pipe can cause SIGPIPE/141.
          grep -E '^host: riscv64(gc|a23)-unknown-linux-gnu$' "$RUNNER_TEMP/riscv-logs/toolchain.txt"
      - name: Build all release test executables once
        id: build
        continue-on-error: true
        timeout-minutes: 45
        run: cargo test -p randomx-rust -p rxminer -p rx-platform --locked --release --no-run 2>&1 | tee "$RUNNER_TEMP/riscv-logs/build.log"
      - name: Formatting
        id: format
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        run: cargo fmt --all --check 2>&1 | tee "$RUNNER_TEMP/riscv-logs/format.log"
      - name: Rust lint checks
        id: lint
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        run: cargo clippy -p rxminer -p randomx-rust -p rx-platform --locked --release --all-targets --features test-dev-fee -- -D warnings 2>&1 | tee "$RUNNER_TEMP/riscv-logs/lint.log"
      - name: Unit tests, known hashes, shared cache and CLI
        id: unit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: cargo test -p randomx-rust -p rxminer -p rx-platform --locked --release --no-fail-fast -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/riscv-logs/unit.log"
      - name: Rust complete v1/v2 hash vectors
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: cargo test -p randomx-rust --locked --release --lib upstream_full_hashes -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/riscv-logs/native.log"
      - name: Rust full datasets, JIT and allocator policy
        id: consensus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        run: cargo test -p randomx-rust -p rx-platform --locked --release --lib -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/riscv-logs/consensus.log"
      # Dataset construction takes several minutes on baseline RV64 runners.
      # Keep all lifecycle cases, with a budget independent of the core suite.
      - name: Miner full datasets and worker lifecycle
        id: lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 70
        run: cargo test -p rxminer --locked --release --lib -- --ignored --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/riscv-logs/lifecycle.log"
      - name: Light and full-memory CLI mining
        id: mining
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 70
        run: cargo test --locked --release --test portable -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/riscv-logs/mining.log"
      - name: C++ backend contract and complete mode matrix
        id: cpp
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        run: cargo test -p rxminer --locked --release --no-default-features --features randomx-cpp --test backend_contract -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/riscv-logs/cpp.log"
      - name: Cargo installation and offline hashing
        id: install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/rxminer-install" 2>&1 | tee "$RUNNER_TEMP/riscv-logs/install.log"
          "$RUNNER_TEMP/rxminer-install/bin/rxminer" --version
          timeout --kill-after=10s 10m "$RUNNER_TEMP/rxminer-install/bin/rxminer" \
            --benchmark-seconds 5 --randomx-mode light --threads 1 \
            --randomx-no-numa --no-huge-pages --no-proxy \
            2>&1 | tee "$RUNNER_TEMP/riscv-logs/smoke.log"
          grep -E 'benchmark finished: [1-9][0-9]* hashes' "$RUNNER_TEMP/riscv-logs/smoke.log"
      - name: Save all validation logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: riscv-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/riscv-logs/
          retention-days: 14
          if-no-files-found: warn
      - name: Report every result and fail if any check failed
        if: ${{ !cancelled() }}
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          printf '| Check | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          jq -r 'to_entries[] | "| \(.key) | \(.value.outcome) |"' <<< "$STEP_RESULTS" >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .outcome == "success")' <<< "$STEP_RESULTS"
      - name: Production Rust release binary
        if: inputs.package
        run: cargo build --release --locked --no-default-features --features randomx-rust
      - uses: ./.github/actions/package
        if: inputs.package
        with:
          platform: linux-riscv64
          backend: rust
      - name: Production C++ release binary
        if: inputs.package
        run: cargo build --release --locked --no-default-features --features randomx-cpp
      - uses: ./.github/actions/package
        if: inputs.package
        with:
          platform: linux-riscv64
          backend: cpp
