[package]
name = "randomx-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT AND BSD-3-Clause"
description = "Pure Rust RandomX v1/v2 with interpreter and x86-64, ARM64 and RV64 JITs"
[dependencies]
anyhow = "1"
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
