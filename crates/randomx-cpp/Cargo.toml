[package]
name = "randomx-cpp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT AND BSD-3-Clause"
description = "Owned Rust interface to the bundled RandomX C++ implementation"
links = "randomx"
[features]
vaes = []
[dependencies]
anyhow = "1"
libc = "0.2"
[build-dependencies]
cc = "1"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"
