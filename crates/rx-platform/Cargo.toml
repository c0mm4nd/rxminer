[package]
name = "rx-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "CPU topology, affinity, NUMA placement and OS resource limits"
readme = "README.md"

[dependencies]
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
